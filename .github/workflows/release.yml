name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/android-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build standard and AA debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardDebug :app:assembleAaDebug --no-daemon

      - name: Collect APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="0.4.1-dev"; fi
          mkdir -p out
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk \
             "out/VAG-Performance-Monitor-${VERSION}-standard.apk"
          cp app/build/outputs/apk/aa/debug/app-aa-debug.apk \
             "out/VAG-Performance-Monitor-${VERSION}-AA.apk"
          sha256sum out/*.apk > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Сборки

            - `...-standard.apk` — без Android Auto: приборка, виджет, профили
              автомобилей и подключение ELM327.
            - `...-AA.apk` — то же плюс `CarAppService` для Android Auto
              (шаблонный экран Car App Library). Полноэкранная приборка в
              штатном Android Auto недоступна: там нет произвольного Canvas.
              Для полноэкранного режима используйте AARE/DashGrid.

            APK собраны как debug и подписаны debug-ключом CI. Установите один
            из двух: у сборок одинаковый `applicationId`. Если ключ предыдущей
            установки отличался, сначала удалите старое приложение.

            Подробности: `docs/AA.md`, `docs/WIDGET.md`, `docs/AARE_DASHGRID.md`.

      - name: Hide older releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the latest version stays visible; older ones become drafts (not deleted).
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' |
          while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            gh release edit "$tag" --draft
          done

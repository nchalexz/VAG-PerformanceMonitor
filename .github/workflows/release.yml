name: Publish VPM diagnostic APKs

on:
  push:
    tags:
      - 'v0.6.3-diagnostics.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/android-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test diagnostic APKs
        run: ./gradlew :app:testStandardDebugUnitTest :app:testAaDebugUnitTest :app:assembleStandardDebug :app:assembleAaDebug --no-daemon

      - name: Publish diagnostic assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk out/VPM-0.6.3-diagnostics-standard.apk
          cp app/build/outputs/apk/aa/debug/app-aa-debug.apk out/VPM-0.6.3-diagnostics-aa.apk
          (cd out && sha256sum ./*.apk > VPM-0.6.3-diagnostics-SHA256SUMS.txt)
          cat > diagnostic-notes.md <<'EOF'

          ## Диагностическая сборка VPM 0.6.3

          Файлы с пометкой `diagnostics` записывают задержки обмена с ELM327 и публикации телеметрии, сохраняя настройки опроса 0.6.3.
          `diagnostics-standard.apk` — приборка и мост для DashGrid.
          `diagnostics-aa.apk` дополнительно включает экран штатного Android Auto.
          Экспорт после поездки доступен в VPM через **Настройки → Диагностика телеметрии → Экспорт журнала**.
          Диагностические APK подписаны debug-ключом CI. Обновление поверх установленной версии возможно при совпадении подписи.
          EOF
          gh release view v0.6.3 --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md
          gh release upload v0.6.3 out/* --repo "$GITHUB_REPOSITORY"
          if ! grep -Fq '## Диагностическая сборка VPM 0.6.3' release-notes.md; then
            cat diagnostic-notes.md >> release-notes.md
            gh release edit v0.6.3 --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi

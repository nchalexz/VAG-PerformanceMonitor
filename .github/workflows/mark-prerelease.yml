name: Mark a release as pre-release

# One-off helper: mark an already published release as pre-release without
# rebuilding its APKs. The non-v tag does not trigger the normal release job.
on:
  push:
    tags:
      - 'mark-v0.5.0-prerelease-2'

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Mark v0.5.0 as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease
          gh release view v0.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease

name: Mark a release as pre-release

# One-off helper for tagging an already published release as a pre-release.
# It is triggered by a non-v tag so the normal APK release workflow is not run.
on:
  push:
    tags:
      - 'mark-v0.5.0-prerelease'

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Mark v0.5.0 as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease
          gh release view v0.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease

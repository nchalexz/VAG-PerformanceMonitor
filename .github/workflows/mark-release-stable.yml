name: Mark v0.5.0 as a release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mark-release-stable.yml'

permissions:
  contents: write

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v0.5.0 as a stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.5.0 \
            --title "VAG Performance Monitor 0.5.0" \
            --notes-file docs/releases/0.5.0.md \
            --prerelease=false \
            --latest
          gh release view v0.5.0 --json name,isPrerelease,isLatest

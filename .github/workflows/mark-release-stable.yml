name: Mark v0.5.0 as a release

# One-off helper: clears the pre-release flag on an already published
# release. Triggered by a non-v tag so the APK release workflow is not run.
on:
  push:
    tags:
      - 'mark-v0.5.0-stable'

permissions:
  contents: write

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.5.0 as a stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh --version
          gh release edit v0.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false
          gh release view v0.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,isLatest
